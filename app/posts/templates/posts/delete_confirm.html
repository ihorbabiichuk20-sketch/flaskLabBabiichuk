{% extends "base.html" %}
{% block title %}Видалити пост{% endblock %}
{% block content %}
  <h2>Видалити пост</h2>
  <p>Ви впевнені, що хочете видалити пост <strong>"{{ post.title }}"</strong>?</p>
  <form method="post">
    <button type="submit" class="btn btn-danger">Так, видалити</button>
    <a href="{{ url_for('posts.detail_post', id=post.id) }}" class="btn btn-secondary ms-2">Скасувати</a>
  </form>
{% endblock %}

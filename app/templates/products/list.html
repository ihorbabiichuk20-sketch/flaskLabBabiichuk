{% extends "base.html" %}

{% block content %}
<h1 class="mb-4">Список ноутбуків</h1>
<table class="table table-striped">
  <thead>
    <tr>
      <th>ID</th>
      <th>Назва</th>
      <th>Ціна, грн</th>
    </tr>
  </thead>
  <tbody>
    {% for product in products %}
      <tr>
        <td>{{ product.id }}</td>
        <td>{{ product.name }}</td>
        <td>{{ "{:,.0f}".format(product.price) }}</td>
      </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}

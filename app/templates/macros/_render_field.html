{% macro render_field(field) %}
  <div class="mb-3">
    {{ field.label(class_="form-label") }}
    {% if field.errors %}
      {{ field(class_="form-control is-invalid") }}
      {% for error in field.errors %}
        <div class="invalid-feedback">
          {{ error }}
        </div>
      {% endfor %}
    {% else %}
      {{ field(class_="form-control") }}
    {% endif %}
  </div>
{% endmacro %}
